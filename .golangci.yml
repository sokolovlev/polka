version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
    - sqlclosecheck
    - unconvert
    - wrapcheck
  settings:
    wrapcheck:
      ignore-package-globs:
        - github.com/sokolovlev/polka/*
  exclusions:
    generated: strict
    rules:
      - path: _test\.go
        linters: [gosec, wrapcheck]
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/sokolovlev/polka
