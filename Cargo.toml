[workspace]
resolver = "3"
members = [
  "libs/rust/*",
  "services/inventory",
  "services/payment",
  "services/payment-provider-mock",
]

[workspace.package]
edition = "2021"
rust-version = "1.100"
license = "MIT"
publish = false

[workspace.dependencies]
prost = "0.14.6"
prost-types = "0.14.6"
tonic = "0.14.9"
tonic-health = "0.14.9"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync"] }
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
envy = "0.4.2"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
tower = "0.5.3"
http-body-util = "0.1.5"
tokio-stream = { version = "0.1.19", features = ["net"] }
polka-proto = { path = "libs/rust/proto" }
polka-runtime = { path = "libs/rust/runtime" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
# Smaller binaries for distroless images (spec 9.1: <= 30 MB).
lto = "thin"
codegen-units = 1
strip = "symbols"
